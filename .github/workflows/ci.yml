name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff (code + notebooks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.0
      - run: ruff check --output-format=github .

  notebooks:
    name: Notebook validation (no execution)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nbformat==5.10.4
      # Schema-validate every notebook and report sizes. The notebooks are not
      # executed: they download CIFAR-10 and extract 60k CNN embeddings.
      - name: Validate notebooks
        shell: python
        run: |
          import os, pathlib, sys
          import nbformat
          rows, failed = [], False
          for p in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              try:
                  nbformat.validate(nbformat.read(p, as_version=nbformat.NO_CONVERT))
                  status = "ok"
              except Exception as exc:
                  status, failed = f"FAIL: {type(exc).__name__}", True
                  print(f"::error file={p}::{exc}")
              rows.append(f"| `{p}` | {p.stat().st_size / 1e6:.2f} | {status} |")
          table = "| Notebook | Size (MB) | Status |\n|---|---:|---|\n" + "\n".join(rows)
          print(table)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## Notebooks\n\n" + table + "\n")
          sys.exit(1 if failed else 0)

  test:
    name: Unit tests + Streamlit smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: pytest -q --cov=src --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  pages:
    name: Landing page links (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Internal links and images only, so external sites cannot make CI flaky.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments docs/index.html README.md reports/case_study.md
          fail: true
